# `uvx mypy --python-executable .venv/bin/python` from the repo root checks every Python file in
# the repository, strict, against the packages of the environment built from envs/dspark/
# (scripts/serve-bonsai2.sh builds it in .venv; bench/check.sh finds it).
[mypy]
files = bench, patches, scripts, evidence, bin/mlx-dspark-patched
strict = True
# bench/ and patches/ are namespace-style trees imported after a sys.path insert of the repo root.
explicit_package_bases = True
namespace_packages = True
mypy_path = .
warn_unreachable = True
# The serving stack ships no type information: mlx.nn is a star-import package, mlx-lm and
# mlx-dspark are untyped. They are Any at the boundary, and our modules subclass nn.Module.
disallow_subclassing_any = False
warn_return_any = False
ignore_missing_imports = True

[mypy-mlx.nn.*,mlx.utils,mlx.optimizers,mlx_lm.*,mlx_dspark.*,transformers.*,huggingface_hub.*,numpy.*]
follow_imports = skip
